name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Source security guard
        run: python3 Scripts/verify-security.py
      - name: Publication guard
        run: python3 Scripts/verify-publication.py --tracked
      - name: Pinned download and cask consistency
        run: python3 Scripts/verify-distribution.py --self-test
      - name: Tests
        run: swift test
      - name: Local signed build
        run: bash Scripts/build-app.sh
      - name: Built bundle, signing and localization guard
        run: python3 Scripts/verify-bundle.py --self-test
      - name: Isolated installation and update checks
        run: python3 Scripts/verify-installation.py
